server {
    listen 80;
    root /usr/share/nginx/html;

    # Resume uploads are the largest request (the backend allows 5 MB)
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # Replaces anything the client sent, so rate limits can't be dodged by faking an IP
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Evaluations stream as server-sent events
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client-side routes such as /history all load the app
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
