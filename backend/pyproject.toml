[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Correctness-focused: pyflakes, syntax/statement errors and bugbear (no style rules)
select = ["E4", "E7", "E9", "F", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # so `import app` works when run as plain `pytest`

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection uses calls in argument defaults by design
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query"]
