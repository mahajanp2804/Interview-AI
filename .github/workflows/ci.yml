name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  backend-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ci-placeholder
      POSTGRES_PASSWORD: ci
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up -d --build --wait
      - name: Smoke test through nginx
        run: |
          set -eux
          curl -sf http://localhost:8080/ | grep -q '<div id="root">'
          curl -sf http://localhost:8080/history | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/auth/me)" = 401
          curl -sf -c cookies -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"correct horse"}' http://localhost:8080/api/auth/register
          curl -sf -b cookies http://localhost:8080/api/auth/me | grep -q ci@example.com
          curl -sf -b cookies http://localhost:8080/api/sessions/stats/progress | grep -q trend
      - if: failure()
        run: docker compose logs
